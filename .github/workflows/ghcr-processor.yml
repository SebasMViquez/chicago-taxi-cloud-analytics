name: ghcr-processor

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PROCESSOR_IMAGE: ghcr.io/${{ github.repository }}/chicago-taxi-processing:${{ github.sha }}

jobs:
  build-and-push-processor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: processing
          push: true
          tags: |
            ${{ env.PROCESSOR_IMAGE }}
            ghcr.io/${{ github.repository }}/chicago-taxi-processing:latest
